<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>palacemuseum</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Page content */
#content {
    padding: 40px;
}

/* Full-screen lock screen */
#lockScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#codeInput {
    padding: 12px;
    font-size: 18px;
    margin: 10px;
    width: 250px;
    text-align: center;
}

#dingButton {
    position: absolute;
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
}

#error {
    color: red;
    margin-top: 10px;
}
</style>
</head>
<body>

<div id="lockScreen">
    <h1>lol?</h1>
    <p>notsofastlilniggalol</p>

    <input type="password" id="codeInput" placeholder="supersecretphrasehereplease">
    <button id="dingButton" onclick="checkCode()">ding</button>

    <div id="error"></div>
</div>

<div id="content">
    <h1>SUPER SECRET DO NOT ENTER!</h1>
    <p>you think its that easy my boy?crycrycrycryLOLOLOLOLOL</p>
</div>

<script>
const ACCESS_CODE = "pingthefox";

const dingButton = document.getElementById("dingButton");

// Start button near the center
dingButton.style.left = "50%";
dingButton.style.top = "55%";
dingButton.style.transform = "translate(-50%, -50%)";

// Random number of dodges (1-10)
let movesRemaining = Math.floor(Math.random() * 10) + 1;

function moveButton() {
    if (movesRemaining <= 0) return;

    const maxX = window.innerWidth - dingButton.offsetWidth;
    const maxY = window.innerHeight - dingButton.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    dingButton.style.transform = "none";
    dingButton.style.left = randomX + "px";
    dingButton.style.top = randomY + "px";

    movesRemaining--;
}

// Dodge when the mouse gets over it
dingButton.addEventListener("mouseenter", moveButton);

function checkCode() {
    // If dodges remain, move instead of allowing click
    if (movesRemaining > 0) {
        moveButton();
        return;
    }

    const enteredCode = document.getElementById("codeInput").value;

    if (enteredCode === ACCESS_CODE) {
        document.getElementById("lockScreen").style.display = "none";
    } else {
        document.getElementById("error").textContent = "Incorrect code.";

        // New random dodge count after wrong password
        movesRemaining = Math.floor(Math.random() * 10) + 1;
    }
}
</script>

</body>
</html>

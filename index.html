<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colonelians.com</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/faviconss/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/faviconss/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/faviconss/favicon-16x16.png">
    <link rel="manifest" href="/faviconss/site.webmanifest">

    <style>

        body{
            margin:0;
            animation:bgChange 10s infinite linear;
            font-family:Arial, Helvetica, sans-serif;
        }

        @keyframes bgChange{
            0%   { background-color:#ff0000; }
            16%  { background-color:#ff8000; }
            33%  { background-color:#ffff00; }
            50%  { background-color:#00ff00; }
            66%  { background-color:#0080ff; }
            83%  { background-color:#8000ff; }
            100% { background-color:#ff0000; }
        }


        .logo-container{
            text-align:center;
            margin-top:20px;
        }

        .logo{
            width:1000px;
            max-width:95%;
            height:auto;
        }

        .buttons{
            margin-top:40px;

            display:flex;
            justify-content:space-evenly;
            align-items:center;

            width:100%;
        }

        .buttons img{
            width:220px;     
            height:auto;
            transition:.2s;
            image-rendering:auto;
        }

        .buttons img:hover{
            transform:translateY(-5px) scale(1.05);
            filter:drop-shadow(0 0 5px white);
        }

    </style>
</head>



    

<body>

    <div class="logo-container">
        <img src="/img/colonelianswebsite.png" alt="Colonelians" class="logo">
    </div>

    <div class="buttons">

        <a href="/directories/members.html/">
            <img src="/img/members.png" alt="Members">
        </a>

        <a href="/directories/gallery.html/">
            <img src="/img/gallery.png" alt="Gallery">
        </a>

        <a href="/directories/extras.html/">
            <img src="/img/extra.png" alt="Extras">
        </a>

    </div>

</body>
</html>

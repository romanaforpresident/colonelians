<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonelians</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/faviconss/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/faviconss/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/faviconss/favicon-16x16.png">
    <link rel="manifest" href="/faviconss/site.webmanifest">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            animation: bgChange 10s infinite linear;
            font-family: Arial, Helvetica, sans-serif;
        }

@keyframes bgChange {
          0%   { background-color: #370811; }
16%  { background-color: #2b1800; }
33%  { background-color: #34061d; }
50%  { background-color: #042322; }
66%  { background-color: #061b25; }
83%  { background-color: #27082c; }
100% { background-color: #380c14; }
        }

        
        .logo-container {
            text-align: center;
            margin-top: 20px;
        }

        .logo {
            width: 1000px;
            max-width: 95%;
            height: auto;
        }

        .buttons {
            margin: 40px auto 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            width: min(95%, 1250px);
        }

        .buttons img {
            width: 220px;
            max-width: 80vw;
            height: auto;
            transition: transform 0.2s, filter 0.2s;
        }

        .buttons .members-button {
            width: 260px;
        }

        .buttons img:hover {
            transform: translateY(-5px) scale(1.05);
            filter: drop-shadow(0 0 5px white);
        }
    </style>
</head>

<body>

<audio autoplay loop>
  <source src="/audio/CalendarGirl.mp3" type="audio/mpeg">
</audio>


    
    <div class="logo-container">
        <img src="/img/colonelianswebsite.png" alt="Colonelians" class="logo">
    </div>

    <div class="buttons">
        <a href="directories/members.html">
            <img src="/img/members.png" alt="Members" class="members-button">
        </a>

        <a href="directories/gallery.html">
            <img src="/img/gallery.png" alt="Gallery">
        </a>

        <a href="directories/extras.html">
            <img src="/img/extra.png" alt="Extras">
        </a>
    </div>
</body>
</html>
